<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/dynetLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101311" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Dynet - planning en voortgang van glasvezelinstallaties" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400,0..1,0&display=block" rel="stylesheet" />
    <title>Dynet</title>
    <script>
      // Apply the saved theme before the first paint to avoid a light flash in dark mode.
      (function () {
        try {
          var saved = localStorage.getItem('dynet.theme');
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Naar de inhoud</a>
    <div id="root"></div>
    <!-- BUILD_VERSION_PLACEHOLDER -->
  </body>
</html>
